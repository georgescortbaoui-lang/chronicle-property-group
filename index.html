<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chronicle Property Group — Coming soon</title>
<meta name="description" content="Chronicle Property Group, Naples, Florida. Launching soon.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070C16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#070C16; --bg2:#0E1728; --ink:#F0EDE5; --dim:#94A0B8; --gold:#C9A96A; --gold2:#E3C98F;
  --f-display:"Cinzel",Georgia,"Times New Roman",serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100vh; min-height:100dvh;
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%, rgba(201,169,106,.10), transparent 70%),
    radial-gradient(ellipse 120% 90% at 50% 0%, var(--bg2), var(--bg) 70%);
  background-color:var(--bg);
  color:var(--ink); font-family:var(--f-body); -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:48px 16px; text-align:center; overflow-x:hidden;
}
main{display:flex; flex-direction:column; align-items:center; width:100%; max-width:960px}
.mark{
  width:min(72vw,440px); height:auto; color:var(--gold);
  filter:drop-shadow(0 0 40px rgba(201,169,106,.18));
  animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both;
}
.word{
  font-family:var(--f-display); font-weight:600;
  font-size:clamp(34px,9vw,88px); letter-spacing:.24em; line-height:1;
  margin-top:clamp(28px,5vw,48px); padding-left:.24em; /* balance trailing tracking */
  animation:fade 1.4s .35s ease both;
}
.sub{
  font-size:clamp(9px,1.6vw,13px); letter-spacing:.32em; color:var(--dim); font-weight:500;
  margin-top:clamp(12px,2vw,18px); padding-left:.32em; text-transform:uppercase;
  animation:fade 1.4s .55s ease both;
}
.rule{width:64px; height:1px; background:var(--gold); opacity:.7; margin:clamp(36px,6vw,56px) 0 clamp(20px,3vw,26px); animation:fade 1.4s .75s ease both}
.soon{
  font-family:var(--f-display); font-size:clamp(15px,2.4vw,20px); letter-spacing:.3em; color:var(--gold2);
  padding-left:.3em; animation:fade 1.4s .9s ease both;
}
.place{font-size:13px; letter-spacing:.14em; color:var(--dim); margin-top:12px; text-transform:uppercase; animation:fade 1.4s 1s ease both}
.contact{
  display:flex; flex-wrap:wrap; gap:10px 28px; justify-content:center;
  margin-top:clamp(28px,4vw,40px); font-size:14px; animation:fade 1.4s 1.1s ease both;
}
.contact a{color:var(--ink); text-decoration:none; border-bottom:1px solid rgba(201,169,106,.45); padding-bottom:2px; transition:color .2s,border-color .2s}
.contact a:hover{color:var(--gold2); border-color:var(--gold2)}
.contact a:focus-visible{outline:2px solid var(--gold); outline-offset:4px; border-radius:2px}
footer{margin-top:clamp(48px,8vw,72px); font-size:11.5px; color:#5F6A80; letter-spacing:.06em; animation:fade 1.4s 1.2s ease both}
@keyframes rise{from{opacity:0; transform:translateY(14px) scale(.97)} to{opacity:1; transform:none}}
@keyframes fade{from{opacity:0} to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="15 33 170 134" fill="none" role="img" aria-label="Chronicle logo"><g stroke="currentColor" stroke-linecap="round"><path d="M 134.67 48.60 A 62 62 0 1 0 134.67 151.40" stroke-width="6"/><path d="M 117.53 64.05 A 40 40 0 1 0 117.53 135.95" stroke-width="6"/><path d="M 20 100 L 180 100" stroke-width="5"/></g><rect x="121" y="93" width="14" height="14" fill="currentColor" stroke="none"/></svg>
  <h1 class="word">CHRONICLE</h1>
  <p class="sub">Property Intelligence &amp; Stewardship</p>
  <div class="rule" aria-hidden="true"></div>
  <p class="soon">COMING SOON</p>
  <p class="place">Naples, Florida</p>
  <p class="contact">
    <a href="mailto:info@chronicleproperty.com">info@chronicleproperty.com</a>
    <a href="tel:+12393809403">(239) 380-9403</a>
  </p>
</main>
<footer>© 2026 Chronicle Property Group LLC</footer>
</body>
</html>
